#!/usr/bin/nft -f
# Cx OS firewall: block every unsolicited incoming connection, allow all outgoing
flush ruleset
table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;
    ct state invalid drop
    ct state { established, related } accept
    iif lo accept
    meta l4proto ipv6-icmp accept
    ip protocol icmp icmp type { echo-reply, destination-unreachable, time-exceeded } accept
    udp sport 67 udp dport 68 accept
    udp dport 5353 ip daddr 224.0.0.251 accept
    pkttype host limit rate 5/second counter reject with icmpx type admin-prohibited
    counter drop
  }
  chain forward {
    type filter hook forward priority filter; policy drop;
  }
}
