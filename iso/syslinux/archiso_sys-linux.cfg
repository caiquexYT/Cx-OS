LABEL arch
TEXT HELP
Boot the Cx OS on BIOS.
It allows you to install Cx OS or perform system maintenance.
ENDTEXT
MENU LABEL Cx OS (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 lsm=landlock,lockdown,yama,integrity,apparmor,bpf %KERNEL_PARAMS%

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the Cx OS on BIOS with speakup screen reader.
It allows you to install Cx OS or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL Cx OS (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on quiet splash loglevel=3 lsm=landlock,lockdown,yama,integrity,apparmor,bpf %KERNEL_PARAMS%
